<div class="filter-sort-controls">

  <select [(ngModel)]="selectedField">
    <option value="">Select Field</option>
    <option *ngFor="let key of fieldKeys" [value]="key">{{ key }}</option>
  </select>

  <input 
    type="text" 
    placeholder="Enter search text..."
    [(ngModel)]="searchText" />

  <button class="floating-search-button" (click)="applyFilter()">
    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#ffffff"><path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z"/></svg>
  </button>

  <!-- ✅ Wrap the toggle in a right-aligned container -->
  <div class="toggle-switch-container">
    <span>DESC</span>
    <label class="toggle-switch">
      <input type="checkbox" [(ngModel)]="isAsc" (change)="onSortOrderToggle()" />
      <span class="slider"></span>
    </label>
    <span>ASC</span>
  </div>

</div>
