<div class="login-container">
  <!-- Optional Logo (if needed) -->
  <div class="top-right-logo">
    <img src="https://www.kaartech.com/wp-content/uploads/2024/09/Non-Text-Magic-Studio-Magic-Design-for-Presentations-LampP-5.png" alt="Logo" />
  </div>

  <div class="login-card">
    <h2>Vendor Login</h2>

    <form (ngSubmit)="login()">
      <div class="input-group">
        <label for="username">Vendor ID</label>
        <input id="username" [(ngModel)]="username" name="username" required />
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input id="password" type="password" [(ngModel)]="password" name="password" required />
      </div>

      <button type="submit" class="login-button" [disabled]="loading">
        {{ loading ? 'Logging in...' : 'Login' }}
      </button>
    </form>

    <p *ngIf="message">{{ message }}</p>
  </div>
</div>
