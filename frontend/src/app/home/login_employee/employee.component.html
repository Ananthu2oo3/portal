<div class="login-container">
  <div class="top-right-logo">
    <img src="https://www.kaartech.com/wp-content/uploads/2024/09/Non-Text-Magic-Studio-Magic-Design-for-Presentations-LampP-5.png" alt="Logo" />
  </div>

  <form class="login-card" (ngSubmit)="onLogin()">
    <h2>Employee Login</h2>

    <div class="input-group">
      <label for="username">Username</label>
      <input
        type="text"
        id="username"
        name="username"
        [(ngModel)]="username"
        required
        autocomplete="username"
      />
    </div>

    <div class="input-group">
      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        [(ngModel)]="password"
        required
        autocomplete="current-password"
      />
    </div>

    <button
      type="submit"
      class="login-button"
      [disabled]="isLoading"
    >
      {{ isLoading ? 'Logging in...' : 'Login' }}
    </button>

    <div class="status" *ngIf="statusMessage">{{ statusMessage }}</div>
  </form>
</div>
