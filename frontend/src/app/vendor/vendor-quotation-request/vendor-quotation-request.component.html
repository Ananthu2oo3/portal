<button class="floating-back-button" (click)="goBack()"> <svg xmlns="http://www.w3.org/2000/svg" height="40px" viewBox="0 -960 960 960" width="40px" fill="#ffffff"><path d="M560.67-240 320-480.67l240.67-240.66L608-674 414.67-480.67 608-287.33 560.67-240Z"/></svg></button>
<app-sidebar-nav></app-sidebar-nav>

<div class="container">
  <div class="header-row">
  <h2 class="title">Request for Quotation</h2>
  <button class="download-button" (click)="downloadExcel()" [disabled]="!vendorData.length">
    Download as Excel
  </button>
</div>

  <div *ngIf="loading">Loading...</div>
  <div *ngIf="error" class="error">{{ error }}</div>
<div class="table-wrapper">
  
  <table *ngIf="vendorData.length" class="styled-table">
    <thead>
      <tr>
        <th *ngFor="let key of vendorDataKeys">{{ key }}</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of vendorData">
        <td *ngFor="let key of vendorDataKeys">{{ item[key] || 'N/A' }}</td>
      </tr>
    </tbody>
  </table>
  </div>

  <div *ngIf="!loading && !vendorData.length && !error">
    No data available.
  </div>
</div>
