<app-sidebar-nav></app-sidebar-nav>

<div class="container">
  <h2 class="title">Inquiry Data</h2>

  <div *ngIf="loading">Loading...</div>
  <div *ngIf="error" class="error">{{ error }}</div>

  <table *ngIf="customerData.length" class="styled-table">
    <thead>
      <tr>
        <th *ngFor="let key of fieldKeys">{{ key }}</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of customerData">
        <td *ngFor="let key of fieldKeys">{{ item[key] || 'N/A' }}</td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="!loading && !customerData.length && !error">
    No data available.
  </div>
</div>
